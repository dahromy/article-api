framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        prefix_seed: article_api
        
        # Default cache adapter
        app: cache.adapter.filesystem
        
        # Cache pools for different use cases
        pools:
            # Cache for articles (short-term)
            cache.articles:
                adapter: cache.adapter.filesystem
                default_lifetime: 3600 # 1 hour
                
            # Cache for user data (medium-term)
            cache.users:
                adapter: cache.adapter.filesystem
                default_lifetime: 7200 # 2 hours
                
            # Cache for aggregated data (long-term)
            cache.aggregated:
                adapter: cache.adapter.filesystem
                default_lifetime: 21600 # 6 hours

        # Redis configuration (uncomment if using Redis)
        # default_redis_provider: redis://localhost:6379
        # pools:
        #     cache.articles:
        #         adapter: cache.adapter.redis
        #         provider: app.redis
        #         default_lifetime: 3600
