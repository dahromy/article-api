# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(MONGODB_URL): ''
    env(MONGODB_DB): ''
    app.version: '%env(default:app_version_default:API_VERSION)%'
    app_version_default: '1.0.0'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Event Listeners Configuration
    App\EventListener\ExceptionListener:
        arguments:
            $environment: '%kernel.environment%'
        tags:
            - { name: kernel.event_listener, event: kernel.exception, method: onKernelException }

    App\EventSubscriber\ApiExceptionSubscriber:
        arguments:
            $appEnv: '%kernel.environment%'

    App\EventListener\ApiLoggingListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 1024 }
            - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse, priority: -1024 }

    App\EventListener\ApiRateLimitListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: __invoke, priority: 5 }

    App\EventListener\ApiRateLimitResponseListener:
        tags:
            - { name: kernel.event_listener, event: kernel.response, method: __invoke, priority: 0 }

    App\EventListener\SecurityHeadersListener:
        tags:
            - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse }

    App\EventListener\RateLimitListener:
        arguments:
            $apiReadLimiter: '@limiter.api_read'
            $apiWriteLimiter: '@limiter.api_write'
            $authLimiter: '@limiter.auth'

    # JWT Event Listeners
    App\EventListener\JWTExpiredListener:
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_expired, method: onJWTExpired }

    App\EventListener\JWTInvalidListener:
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_invalid, method: onJWTInvalid }

    App\EventListener\JWTNotFoundListener:
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_not_found, method: onJWTNotFound }
