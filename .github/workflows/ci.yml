name: CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v2

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.2'
                    extensions: mongodb

            -   name: Install dependencies
                run: composer install --prefer-dist --no-progress --ignore-platform-req=ext-mongodb

            -   name: Run test suite
                run: php bin/phpunit